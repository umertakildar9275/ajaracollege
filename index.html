<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Janata Education Society's Ajara Mahavidyalaya, Ajara</title>
<meta name="description" content="Official website of Ajara Mahavidyalaya, Ajara — a Janata Education Society institution offering Arts, Commerce, Science, BCA, M.Com and M.A. programmes. Accredited at B by NAAC, Kolhapur, Maharashtra.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#FFFDF8">
<link rel="icon" href="https://cdn.shopify.com/s/files/1/1012/1602/6995/files/IMG-3641.png?v=1789199821">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ GLOBAL ============ */
:root{
  --accent:#F97316;
  --accent-dark:#EA6A0A;
  --accent-light:#FFEEDD;
  --secondary:#22C55E;
  --secondary-light:#E4FBEC;
  --yellow:#FBBF24;
  --highlight:#F43F5E;
  --ink:#27272A;
  --ink-soft:#5b5b60;
  --line:#eee2d6;
  --bg:#FFFDF8;
  --bg-off:#F7F8FA;
  --radius:14px;
  --shadow:0 6px 24px rgba(39,39,42,.08);
  --shadow-lg:0 18px 48px rgba(39,39,42,.16);
  --header-h:74px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
ul{margin:0;padding:0;list-style:none}
h1,h2,h3,h4{margin:0;font-weight:700}
p{margin:0;line-height:1.7;color:var(--ink-soft)}
.mr{font-family:'Noto Sans Devanagari','Poppins',sans-serif}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;font-size:.95rem;transition:.4s cubic-bezier(.34,1.56,.64,1);min-height:44px;will-change:transform}
.btn:hover{background:var(--accent-dark);border-color:var(--accent-dark);transform:translateY(-3px) scale(1.045);box-shadow:0 10px 26px rgba(249,115,22,.32)}
.btn:active{transform:translateY(-1px) scale(.98);transition:.12s}
.btn.outline{background:transparent;color:var(--accent-dark)}
.btn.outline:hover{background:var(--accent-light);box-shadow:0 8px 20px rgba(249,115,22,.18)}
.btn.sm{padding:9px 18px;font-size:.85rem}
.section{padding:64px 0}
.section-head{text-align:center;max-width:640px;margin:0 auto 40px}
.eyebrow{color:var(--accent-dark);font-weight:700;letter-spacing:1.5px;font-size:.78rem;text-transform:uppercase}
.section-title{font-size:clamp(1.6rem,3vw,2.3rem);margin-top:8px}
.section-sub{margin-top:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);transition:.45s cubic-bezier(.22,1,.36,1)}
.card:hover{transform:translateY(-8px) scale(1.015);box-shadow:var(--shadow-lg)}
.grid{display:grid;gap:22px}
.reveal{opacity:0;transform:translateY(38px) scale(.97);transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}
.badge{display:inline-block;background:var(--accent-light);color:var(--accent-dark);font-weight:700;font-size:.72rem;letter-spacing:.5px;text-transform:uppercase;padding:4px 12px;border-radius:999px}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent);color:#fff;padding:10px 16px;z-index:9999}
.skip-link:focus{left:10px;top:10px}
:focus-visible{outline:3px solid var(--accent-dark);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.reveal{opacity:1!important;transform:none!important}}

/* ============ HEADER ============ */
header.site-header{position:sticky;top:0;z-index:900;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);transition:.3s}
.header-inner{display:flex;align-items:center;gap:16px;padding:10px 20px;max-width:1300px;margin:0 auto;min-height:var(--header-h)}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.brand img{width:52px;height:52px;object-fit:contain;flex-shrink:0}
.brand-text{min-width:0}
.brand-text .name{font-weight:800;font-size:.95rem;line-height:1.25;color:var(--ink)}
.brand-text .sub{font-size:.68rem;color:var(--ink-soft);font-weight:600}
nav.main-nav{display:none}
.nav-list{display:flex;gap:2px;flex-wrap:wrap}
.nav-list a{padding:9px 12px;font-size:.85rem;font-weight:600;border-radius:8px;color:var(--ink-soft);white-space:nowrap}
.nav-list a:hover,.nav-list a.active{color:var(--accent-dark);background:var(--accent-light)}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{background:var(--accent-light);border-color:var(--accent)}
.hamburger{display:flex}
@media(min-width:1100px){nav.main-nav{display:block}.hamburger{display:none}}

/* mobile drawer */
.drawer-overlay{position:fixed;inset:0;background:rgba(20,30,10,.45);opacity:0;pointer-events:none;transition:.3s;z-index:950}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:-320px;width:300px;max-width:86vw;height:100%;background:#fff;z-index:960;transition:.35s;overflow-y:auto;padding:20px;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.drawer.open{right:0}
.drawer a{display:block;padding:13px 8px;font-weight:600;border-bottom:1px solid var(--line)}
.drawer-close{margin-left:auto;display:block}

/* ============ HERO ============ */
.hero{position:relative;height:min(88vh,680px);min-height:420px;overflow:hidden;background:#111}
.hero-slide{position:absolute;inset:0;opacity:0;transform:scale(1.12);transition:opacity 1.6s cubic-bezier(.22,1,.36,1), transform 8s cubic-bezier(.22,1,.36,1);}
.hero-slide.active{opacity:1;transform:scale(1)}
.hero-slide img{width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35) 85%)}
.hero-caption{position:absolute;left:0;right:0;bottom:70px;text-align:center;color:#fff;padding:0 20px;animation:heroCaptionIn 1.1s cubic-bezier(.22,1,.36,1) both}
.hero-caption .tag{display:inline-block;background:rgba(249,115,22,.28);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.5);padding:6px 16px;border-radius:999px;font-size:.8rem;letter-spacing:1px;font-weight:600}
.hero-caption h1{font-size:clamp(1.4rem,3vw,2rem);margin-top:14px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
@keyframes heroCaptionIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.hero-nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.85);border:none;display:flex;align-items:center;justify-content:center;z-index:5;transition:.3s cubic-bezier(.34,1.56,.64,1)}
.hero-nav-btn:hover{background:var(--accent);color:#fff;transform:translateY(-50%) scale(1.12)}
.hero-nav-btn.prev{left:14px}.hero-nav-btn.next{right:14px}
.hero-dots{position:absolute;bottom:24px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5}
.hero-dots button{width:9px;height:9px;border-radius:50%;border:none;background:rgba(255,255,255,.55);transition:.4s cubic-bezier(.34,1.56,.64,1)}
.hero-dots button.active{background:var(--accent);width:22px;border-radius:6px;box-shadow:0 0 0 3px rgba(249,115,22,.35)}
.scroll-explore{position:absolute;bottom:6px;left:0;right:0;text-align:center;color:#fff;font-size:.75rem;font-weight:600;letter-spacing:1px;z-index:5;cursor:pointer;background:none;border:none}
.scroll-explore .arrow{display:block;margin:6px auto 0;width:18px;height:18px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg);animation:bob 1.6s infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(45deg)}50%{transform:translateY(6px) rotate(45deg)}}

/* ============ PROGRAMMES ============ */
.prog-grid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.prog-card{padding:26px;text-align:left;position:relative}
.prog-card .ic{width:52px;height:52px;border-radius:12px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-dark);font-size:1.3rem;margin-bottom:14px}
.prog-card h3{font-size:1.1rem;margin-bottom:6px}
.prog-card p{font-size:.88rem}
.prog-card .go{margin-top:14px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-dark);font-weight:700;font-size:.85rem}
.prog-card:hover .go{gap:10px}

/* ============ DESK (Principal/Chairman) ============ */
.desk{display:grid;grid-template-columns:1fr;gap:28px;align-items:center}
@media(min-width:820px){.desk{grid-template-columns:230px 1fr}}
.desk-photo{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);aspect-ratio:1/1;object-fit:cover;width:100%}
.desk-name{font-size:1.2rem;margin-top:14px}
.desk-role{color:var(--accent-dark);font-weight:700;font-size:.85rem}

/* ============ ACTIVITY CARDS ============ */
.activity-card{padding:24px 20px;text-align:center}
.activity-card img{width:58px;height:58px;object-fit:contain;margin:0 auto 12px}
.activity-card h3{font-size:1rem}
.activity-card p{font-size:.83rem;margin-top:6px}

/* ============ NEWS ============ */
.news-featured{display:grid;grid-template-columns:1fr;gap:0;overflow:hidden}
@media(min-width:800px){.news-featured{grid-template-columns:1.1fr 1fr}}
.news-featured img{width:100%;height:100%;object-fit:cover;min-height:220px}
.news-featured .body{padding:28px}
.news-grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.news-card{overflow:hidden;display:flex;flex-direction:column}
.news-card img{height:170px;width:100%;object-fit:cover}
.news-card .body{padding:18px;flex:1;display:flex;flex-direction:column}
.news-card h3{font-size:1rem;margin:8px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.tab-btn{padding:9px 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:.85rem}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ============ VIDEO / GALLERY ============ */
.video-grid,.gallery-grid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.video-card{overflow:hidden;cursor:pointer}
.video-thumb{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.video-thumb img{width:100%;height:100%;object-fit:cover;transition:.4s}
.video-card:hover .video-thumb img{transform:scale(1.08)}
.play-ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.play-ic span{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;color:var(--accent-dark);font-size:1.2rem}
.video-card .body{padding:14px}
.gallery-cover{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3;cursor:pointer}
.gallery-cover img{width:100%;height:100%;object-fit:cover;transition:.4s}
.gallery-cover:hover img{transform:scale(1.06)}
.gallery-cover .yr-label{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent);color:#fff}
.photo-grid{grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.photo-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.photo-grid{grid-template-columns:repeat(4,1fr)}}
.photo-item{aspect-ratio:1/1;border-radius:10px;overflow:hidden;cursor:pointer}
.photo-item img{width:100%;height:100%;object-fit:cover;transition:.4s}
.photo-item:hover img{transform:scale(1.08)}

/* ============ LIGHTBOX/MODAL ============ */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2000;display:none;align-items:center;justify-content:center;flex-direction:column}
.lightbox.open{display:flex}
.lightbox img{max-width:92vw;max-height:78vh;object-fit:contain;border-radius:8px}
.lightbox .lb-controls{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;pointer-events:none}
.lightbox .lb-controls button{pointer-events:auto}
.lb-btn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:1.3rem}
.lb-close{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:1.2rem}
.lb-count{color:#fff;margin-top:14px;font-size:.85rem}
.video-modal-frame{width:min(92vw,900px);aspect-ratio:16/9}
.video-modal-frame iframe{width:100%;height:100%;border:0;border-radius:8px}

.modal-overlay{position:fixed;inset:0;background:rgba(15,20,10,.55);z-index:1500;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:var(--radius);max-width:460px;width:100%;padding:26px;box-shadow:var(--shadow-lg)}
.modal-box h3{margin-bottom:10px}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}

.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;padding:0 16px;pointer-events:none;}
.toast{background:#27272A;color:#fff;padding:12px 20px;border-radius:10px;font-size:.88rem;box-shadow:var(--shadow-lg);animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ PAGE HEADER / BREADCRUMB ============ */
.page-hero{background:var(--bg-off);padding:44px 0 34px;border-bottom:1px solid var(--line)}
.breadcrumb{display:flex;gap:6px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-soft);margin-bottom:10px}
.breadcrumb a{color:var(--accent-dark);font-weight:600}
.page-hero h1{font-size:clamp(1.5rem,3vw,2.1rem)}
main{min-height:50vh}

/* Accordion */
.accordion-item{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.accordion-head{width:100%;text-align:left;padding:16px 18px;background:#fff;border:none;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.accordion-head:hover{background:var(--bg-off)}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.accordion-item.open .accordion-body{max-height:2000px}
.accordion-inner{padding:4px 18px 18px}
.subject-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.subject-tags span{background:var(--bg-off);border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-size:.85rem}
.subject-group h4{font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-dark);margin-top:14px;margin-bottom:4px}

table.acad{width:100%;border-collapse:collapse;font-size:.85rem}
table.acad th,table.acad td{border:1px solid var(--line);padding:8px 10px;text-align:left}
table.acad th{background:var(--bg-off)}
.table-scroll{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft)}
.grid-2{grid-template-columns:1fr}
@media(min-width:820px){.grid-2{grid-template-columns:1fr 1fr}}
.info-list{padding-left:20px;list-style:disc;}
.info-list li{padding:8px 0;font-size:.95rem}
.info-list li b{color:var(--ink)}

form .field{margin-bottom:16px}
form label{display:block;font-weight:600;font-size:.85rem;margin-bottom:6px}
form input,form select,form textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:.95rem}
form input:focus,form select:focus,form textarea:focus{border-color:var(--accent)}
.error-text{color:#c0392b;font-size:.78rem;margin-top:4px}
.helper-text{color:var(--ink-soft);font-size:.78rem;margin-top:4px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}

/* ============ SEARCH ============ */
.search-panel{position:fixed;inset:0;background:#fff;z-index:1800;display:none;flex-direction:column;padding:20px}
.search-panel.open{display:flex}
.search-top{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;width:100%}
.search-input-wrap{flex:1;position:relative}
.search-input-wrap input{width:100%;padding:14px 18px;border-radius:12px;border:2px solid var(--line);font-size:1rem}
.search-input-wrap input:focus{border-color:var(--accent)}
.search-results{max-width:760px;margin:24px auto 0;width:100%;overflow-y:auto}
.result-item{display:block;padding:16px;border-bottom:1px solid var(--line)}
.result-item:hover{background:var(--bg-off)}
.result-item .cat{color:var(--accent-dark);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px}
.result-item h4{margin-top:4px;font-size:1rem}
.result-item p{font-size:.85rem;margin-top:4px}

/* ============ FOOTER ============ */
footer.site-footer{background:#27272A;color:#F7F8FA;padding:56px 0 20px;margin-top:40px}
.footer-grid{display:grid;gap:34px;grid-template-columns:1fr}
@media(min-width:820px){.footer-grid{grid-template-columns:1.4fr 1fr 1fr 1fr}}
footer h4{color:#fff;font-size:.95rem;margin-bottom:14px}
footer a{color:#d8d8dc;font-size:.86rem;line-height:2.2;display:block}
footer a:hover{color:var(--accent)}
.foot-social{display:flex;gap:10px;margin-top:14px}
.foot-social a{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.foot-bottom{border-top:1px solid rgba(255,255,255,.12);margin-top:36px;padding-top:20px;font-size:.78rem;color:#a3a3a8;text-align:center}

/* ============ ADMIN ============ */
.admin-login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-off);padding:20px}
.admin-login-card{background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);padding:34px 26px;width:100%;max-width:380px;text-align:center}
.admin-login-card img{width:56px;margin:0 auto 12px}
.pw-wrap{position:relative}
.pw-wrap button{position:absolute;right:10px;top:9px;background:none;border:none;font-size:.78rem;font-weight:700;color:var(--accent-dark)}
.admin-shell{min-height:100vh;background:var(--bg-off);padding-bottom:70px}
.admin-header{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:80}
.admin-header img{width:36px}
.admin-header .t{font-weight:700;font-size:.9rem}
.admin-header .t small{display:block;font-weight:500;color:var(--ink-soft);font-size:.72rem}
.admin-body{max-width:920px;margin:0 auto;padding:18px}
.admin-card-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.admin-tile{padding:18px;text-align:left;display:block;}
.admin-tile .n{font-size:1.5rem;font-weight:800;color:var(--accent-dark)}
.admin-tile .l{font-size:.82rem;color:var(--ink-soft);margin-top:2px}
.record-card{padding:16px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);}
.record-card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.record-card .title{font-weight:700}
.record-card .meta{font-size:.78rem;color:var(--ink-soft)}
.status-pill{font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:999px}
.status-pill.pub{background:var(--secondary-light);color:#158A43}
.status-pill.draft{background:#FFF4DE;color:#9A6B00}
.status-pill.feat{background:#FFE4EA;color:var(--highlight)}
.record-actions{display:flex;gap:8px;flex-wrap:wrap}
.record-actions button{flex:1;min-width:80px;padding:9px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:.8rem}
.record-actions button.danger{color:#c0392b;border-color:#f2c9c2}
.sticky-save{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) 14px;display:flex;gap:10px;margin-top:20px}
.sticky-save .btn{flex:1;justify-content:center}
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back-row button{background:none;border:none;font-weight:700;color:var(--accent-dark);display:flex;align-items:center;gap:4px}
.img-preview{margin-top:10px;border-radius:10px;overflow:hidden;border:1px solid var(--line);max-height:180px}

, students not only from Ajara taluka but also from neighbouring talukas such as Chandgad, Gadhinglaj from Kolhapur District and Sawantwadi taluka from Sindhudurg District are taking advantage of the educational programs run by the college.\n\nThe college also offers education in Arts, Commerce, Science and vocational/HSCVC wings at Junior /10+2 level.\n\nSo there is optimum/maximum use of infrastructure and students are getting Higher Secondary education and Higher education under one shelter / roof.\n\nThere are various departments/Committees of teachers which undertake different co-curricular and extracurricular activities for all-round development of the students.\n\nSo students of the college perform well in different areas.\n\nMy main concern shall be that the college continues to strive towards academic excellence, social relevance and spiritual vitality.\n\nI am delighted to state that the college will be growing in many areas such as infrastructural development and innovative initiatives.\n\nDue emphasis is being laid on imparting sound education to girl students and at present their strength is more than 50 percent and increasing trend is evident/found in the faculty, as well.\n\nI am confident that the college, with its rich legacy, besides being blessed by his divine hands, will be able to contribute richly in shaping young minds, resulting in national development."

function loadStore(key, initial){
  try{
    var raw = localStorage.getItem(key);
    if(raw===null){ localStorage.setItem(key, JSON.stringify(initial)); return JSON.parse(JSON.stringify(initial)); }
    return JSON.parse(raw);
  }catch(e){ return JSON.parse(JSON.stringify(initial)); }
}
function saveStore(key, data){
  try{ localStorage.setItem(key, JSON.stringify(data)); return true; }
  catch(e){ toast("Unable to save changes on this device. Please check browser storage and try again."); return false; }
}

function esc(str){
  if(str===undefined||str===null) return "";
  return String(str).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});
}
function nl2p(str){
  return String(str||"").split(/\n\s*\n/).map(function(p){return "<p>"+esc(p).replace(/\n/g,"<br>")+"</p>";}).join("");
}
function fmtDate(d){
  if(!d) return "";
  var dt = new Date(d+"T00:00:00");
  if(isNaN(dt)) return d;
  var months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  return dt.getDate()+" "+months[dt.getMonth()]+" "+dt.getFullYear();
}
function extractYouTubeId(url){
  if(!url) return "";
  var m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : "";
}

  var matches = q ? idx.filter(function(i){ return (i.title+" "+i.excerpt+" "+i.cat).toLowerCase().indexOf(q)>-1; }) : [];
  if(!q){ res.innerHTML = '<div class="empty-state">Start typing to search pages, programmes, faculty, news, facilities and more.</div>'; return; }
  if(!matches.length){ res.innerHTML = '<div class="empty-state">No results found.<br>Try another keyword or search for a department, programme, facility or notice.</div>'; return; }
  res.innerHTML = matches.slice(0,30).map(function(m){
    return '<a class="result-item" href="'+m.href+'" onclick="closeSearch()"><span class="cat">'+esc(m.cat)+'</span><h4>'+esc(m.title)+'</h4><p>'+esc((m.excerpt||"").slice(0,110))+'</p></a>';
  }).join("");
}

var observer;
function initReveal(){
  var els = document.querySelectorAll(".reveal:not(.in)");
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ els.forEach(function(e){e.classList.add("in");}); return; }
  if(observer) observer.disconnect();
  observer = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); observer.unobserve(e.target); } });
  }, {threshold:.12});
  els.forEach(function(e){ observer.observe(e); });
}

  }).join("");

  return '<section class="hero" id="heroSection">'+slides+

}
function initHeroSlider(){
  var slides = document.querySelectorAll("#heroSection .hero-slide");
  var dots = document.querySelectorAll("#heroSection .hero-dots button");
  if(!slides.length) return;
  var i=0, timer;
  function show(n){
    slides[i].classList.remove("active"); dots[i].classList.remove("active");
    i=(n+slides.length)%slides.length;
    slides[i].classList.add("active"); dots[i].classList.add("active");
  }
  function next(){ show(i+1); }
  function restart(){ clearInterval(timer); timer=setInterval(next,5000); }
  restart();
  document.getElementById("heroNext").onclick=function(){ next(); restart(); };
  document.getElementById("heroPrev").onclick=function(){ show(i-1); restart(); };
  dots.forEach(function(d){ d.onclick=function(){ show(parseInt(d.dataset.i,10)); restart(); }; });
  
  var heroEl = document.getElementById("heroSection");
  if(matchMedia('(hover: hover)').matches){
    heroEl.addEventListener("mouseenter", function(){ clearInterval(timer); });
    heroEl.addEventListener("mouseleave", restart);
  }
  document.getElementById("scrollExploreBtn").onclick = function(){
    var next = document.getElementById("heroSection").nextElementSibling;
    if(next) next.scrollIntoView({behavior:(matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth')});
  };
  
  var startX=null;
  heroEl.addEventListener("touchstart", function(e){ startX=e.touches[0].clientX; }, {passive:true});
  heroEl.addEventListener("touchend", function(e){
    if(startX===null) return;
    var dx = e.changedTouches[0].clientX - startX;
    if(dx>40){ show(i-1); restart(); }
    else if(dx<-40){ next(); restart(); }
    else { restart(); } 
    startX=null;
  });
}

function renderGalleryRoute(parts, main){
  var id = parts[1];
  
  if(id){
    var col = DB.gallery.collections.filter(function(c){return c.id===id;})[0];
    if(!col){ render404(main); return; }
    var photos = DB.gallery.photos.filter(function(p){return p.year===id && p.published;}).sort(function(a,b){return (a.order||0)-(b.order||0);});
    var html = pageHero(col.title+" Gallery", [{label:"Home",href:"#/home"},{label:"Gallery",href:"#/gallery"},{label:col.title}])+
      '<section class="section container reveal in"><div class="grid photo-grid">';
    if(photos.length===0){ html += '<div class="empty-state" style="grid-column:1/-1">No photos in this collection.</div>'; }
    else {
      photos.forEach(function(p, i){
        html += '<div class="photo-item" onclick="openLightbox('+i+', \''+id+'\')"><img src="'+p.imageUrl+'" loading="lazy" '+imgFallbackAttr()+'></div>';
      });
    }
    html += '</div><a href="#/gallery" class="btn outline sm" style="margin-top:30px">&larr; Back to Collections</a></section>';
    main.innerHTML = html;
    return;
  }
  
  var html = pageHero("Photo Gallery", [{label:"Home",href:"#/home"},{label:"Gallery"}])+
   '<section class="section container reveal in"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">';
  var cols = DB.gallery.collections.slice().sort(function(a,b){return (a.order||0)-(b.order||0);});
  if(cols.length===0){
    html += '<div class="empty-state" style="grid-column:1/-1">Gallery collections are being updated.</div>';
  } else {
    cols.forEach(function(c){
      var photos = DB.gallery.photos.filter(function(p){return p.year===c.id && p.published;});
      var cover = photos[0];
      var img = cover ? cover.imageUrl : "";
      html += '<a href="#/gallery/'+c.id+'" class="card" style="padding:14px"><div class="gallery-cover" style="margin-bottom:14px">'+(img?('<img src="'+img+'" loading="lazy" '+imgFallbackAttr()+'>'):('<div style="width:100%;height:100%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;color:var(--accent-dark);font-weight:700;text-align:center;padding:10px">NO PHOTOS</div>'))+'</div><h3 style="text-align:center;font-size:1rem">'+esc(c.title)+'</h3><p style="text-align:center;font-size:.8rem">'+photos.length+' Photos</p></a>';
    });
  }
  html += '</div></section>';
  main.innerHTML = html;
}

var lbData = [];
var lbIndex = 0;
var lbBox = document.getElementById("lightbox");
var lbImg = document.getElementById("lbImg");
var lbCount = document.getElementById("lbCount");
window.openLightbox = function(idx, colId){
  lbData = DB.gallery.photos.filter(function(p){return p.year===colId && p.published;}).sort(function(a,b){return (a.order||0)-(b.order||0);});
  if(!lbData.length) return;
  lbIndex = idx;
  updateLightbox();
  lbBox.classList.add("open");
};
function updateLightbox(){
  lbImg.src = lbData[lbIndex].imageUrl;
  lbCount.textContent = (lbIndex+1)+" of "+lbData.length;
}
document.getElementById("lbClose").onclick = function(){ lbBox.classList.remove("open"); };
document.getElementById("lbPrev").onclick = function(e){ e.stopPropagation(); lbIndex=(lbIndex-1+lbData.length)%lbData.length; updateLightbox(); };
document.getElementById("lbNext").onclick = function(e){ e.stopPropagation(); lbIndex=(lbIndex+1)%lbData.length; updateLightbox(); };
lbBox.onclick = function(e){ if(e.target===lbBox) lbBox.classList.remove("open"); };

window.adminEditNews = function(id){
  var isNew = (id==="new");
  var n = isNew ? {title:"",category:"Notice",date:new Date().toISOString().split("T")[0],excerpt:"",content:"",image:"",featured:false,published:true} : DB.news.filter(function(x){return x.id===id;})[0];
  var fHtml = '<div class="back-row"><button onclick="navigate(\'#/admin/news\')">&larr; Back</button></div><h2>'+(isNew?'Add News':'Edit News')+'</h2><div class="card" style="padding:20px;margin-top:20px"><form id="newsForm"><div class="field"><label>Title</label><input type="text" id="nTitle" value="'+esc(n.title)+'" required></div><div class="grid grid-2"><div class="field"><label>Category</label><select id="nCat"><option '+(n.category==='Notice'?'selected':'')+'>Notice</option><option '+(n.category==='Event'?'selected':'')+'>Event</option><option '+(n.category==='Achievement'?'selected':'')+'>Achievement</option></select></div><div class="field"><label>Date</label><input type="date" id="nDate" value="'+esc(n.date)+'" required></div></div><div class="field"><label>Image URL (Optional)</label><input type="text" id="nImg" value="'+esc(n.image)+'"></div><div class="field"><label>Short Excerpt</label><textarea id="nExc" rows="2">'+esc(n.excerpt)+'</textarea></div><div class="field"><label>Full Content</label><textarea id="nCon" rows="6" required>'+esc(n.content)+'</textarea></div><div class="toggle-row"><label>Published</label><input type="checkbox" id="nPub" '+(n.published?'checked':'')+'></div><div class="toggle-row"><label>Featured on Homepage</label><input type="checkbox" id="nFeat" '+(n.featured?'checked':'')+'></div></form></div><div class="sticky-save"><button class="btn outline" onclick="navigate(\'#/admin/news\')">Cancel</button><button class="btn" onclick="window.adminSaveNews(\''+id+'\')">Save Changes</button></div>';
  document.querySelector('.admin-body').innerHTML = fHtml;
};
window.adminSaveNews = function(id){
  var isNew = (id==="new");
  if(!document.getElementById("nTitle").value.trim()){ toast("Title is required."); return; }
  var obj = {
    id: isNew ? uid('n') : id,
    title: document.getElementById("nTitle").value, category: document.getElementById("nCat").value,
    date: document.getElementById("nDate").value, image: document.getElementById("nImg").value,
    excerpt: document.getElementById("nExc").value, content: document.getElementById("nCon").value,
    published: document.getElementById("nPub").checked, featured: document.getElementById("nFeat").checked
  };
  if(isNew) DB.news.push(obj);
  else DB.news = DB.news.map(function(x){return x.id===id?obj:x;});
  if(saveStore("ajaramahavidyalaya_news", DB.news)){ toast("News saved!"); logActivity(isNew?"Created News":"Updated News", obj.title); navigate("#/admin/news"); }
};
window.adminDeleteNews = function(id){ confirmModal("Delete this news article?", function(){ DB.news=DB.news.filter(function(x){return x.id!==id;}); if(saveStore("ajaramahavidyalaya_news", DB.news)){ toast("Deleted."); navigate("#/admin/news"); } }); };

    published: document.getElementById("vPub").checked, order: isNew ? DB.videos.length+1 : DB.videos.filter(function(x){return x.id===id;})[0].order
  };
  if(isNew) DB.videos.push(obj);
  else DB.videos = DB.videos.map(function(x){return x.id===id?obj:x;});
  if(saveStore("ajaramahavidyalaya_videos", DB.videos)){ toast("Video saved!"); logActivity(isNew?"Added Video":"Updated Video", obj.title); navigate("#/admin/videos"); }

window.adminDeleteVideo = function(id){ confirmModal("Delete this video?", function(){ DB.videos=DB.videos.filter(function(x){return x.id!==id;}); if(saveStore("ajaramahavidyalaya_videos", DB.videos)){ toast("Deleted."); navigate("#/admin/videos"); } }); };
