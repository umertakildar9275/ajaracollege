<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Janata Education Society's Ajara Mahavidyalaya, Ajara</title>
<meta name="description" content="Official website of Ajara Mahavidyalaya, Ajara — a Janata Education Society institution offering Arts, Commerce, Science, BCA, M.Com and M.A. programmes. Accredited at B by NAAC, Kolhapur, Maharashtra.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="https://cdn.shopify.com/s/files/1/1012/1602/6995/files/IMG-3641.png?v=1789199821">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ GLOBAL ============ */
:root{
  --accent:#71B62C;
  --accent-dark:#568f21;
  --accent-light:#EAF6DC;
  --ink:#1c2117;
  --ink-soft:#4b5245;
  --line:#e7ebe2;
  --bg:#ffffff;
  --bg-off:#f7faf4;
  --radius:14px;
  --shadow:0 6px 24px rgba(20,30,10,.08);
  --shadow-lg:0 18px 48px rgba(20,30,10,.14);
  --header-h:74px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
ul{margin:0;padding:0;list-style:none}
h1,h2,h3,h4{margin:0;font-weight:700}
p{margin:0;line-height:1.7;color:var(--ink-soft)}
.mr{font-family:'Noto Sans Devanagari','Poppins',sans-serif}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;font-size:.95rem;transition:.25s;min-height:44px}
.btn:hover{background:var(--accent-dark);border-color:var(--accent-dark);transform:translateY(-2px)}
.btn.outline{background:transparent;color:var(--accent-dark)}
.btn.outline:hover{background:var(--accent-light)}
.btn.sm{padding:9px 18px;font-size:.85rem}
.section{padding:64px 0}
.section-head{text-align:center;max-width:640px;margin:0 auto 40px}
.eyebrow{color:var(--accent-dark);font-weight:700;letter-spacing:1.5px;font-size:.78rem;text-transform:uppercase}
.section-title{font-size:clamp(1.6rem,3vw,2.3rem);margin-top:8px}
.section-sub{margin-top:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);transition:.3s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.grid{display:grid;gap:22px}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
.badge{display:inline-block;background:var(--accent-light);color:var(--accent-dark);font-weight:700;font-size:.72rem;letter-spacing:.5px;text-transform:uppercase;padding:4px 12px;border-radius:999px}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent);color:#fff;padding:10px 16px;z-index:9999}
.skip-link:focus{left:10px;top:10px}
:focus-visible{outline:3px solid var(--accent-dark);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.reveal{opacity:1!important;transform:none!important}}

/* ============ HEADER ============ */
header.site-header{position:sticky;top:0;z-index:900;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);transition:.3s}
.header-inner{display:flex;align-items:center;gap:16px;padding:10px 20px;max-width:1300px;margin:0 auto;min-height:var(--header-h)}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.brand img{width:52px;height:52px;object-fit:contain;flex-shrink:0}
.brand-text{min-width:0}
.brand-text .name{font-weight:800;font-size:.95rem;line-height:1.25;color:var(--ink)}
.brand-text .sub{font-size:.68rem;color:var(--ink-soft);font-weight:600}
nav.main-nav{display:none}
.nav-list{display:flex;gap:2px;flex-wrap:wrap}
.nav-list a{padding:9px 12px;font-size:.85rem;font-weight:600;border-radius:8px;color:var(--ink-soft);white-space:nowrap}
.nav-list a:hover,.nav-list a.active{color:var(--accent-dark);background:var(--accent-light)}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{background:var(--accent-light);border-color:var(--accent)}
.hamburger{display:flex}
@media(min-width:1100px){nav.main-nav{display:block}.hamburger{display:none}}

/* mobile drawer */
.drawer-overlay{position:fixed;inset:0;background:rgba(20,30,10,.45);opacity:0;pointer-events:none;transition:.3s;z-index:950}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:-320px;width:300px;max-width:86vw;height:100%;background:#fff;z-index:960;transition:.35s;overflow-y:auto;padding:20px;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.drawer.open{right:0}
.drawer a{display:block;padding:13px 8px;font-weight:600;border-bottom:1px solid var(--line)}
.drawer-close{margin-left:auto;display:block}

/* ============ HERO ============ */
.hero{position:relative;height:min(88vh,680px);min-height:420px;overflow:hidden;background:#111}
.hero-slide{position:absolute;inset:0;opacity:0;transform:scale(1.06);transition:opacity 1.1s ease, transform 5s ease;}
.hero-slide.active{opacity:1;transform:scale(1)}
.hero-slide img{width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35) 85%)}
.hero-caption{position:absolute;left:0;right:0;bottom:70px;text-align:center;color:#fff;padding:0 20px}
.hero-caption .tag{display:inline-block;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.4);padding:6px 16px;border-radius:999px;font-size:.8rem;letter-spacing:1px;font-weight:600}
.hero-caption h1{font-size:clamp(1.4rem,3vw,2rem);margin-top:14px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.hero-nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.85);border:none;display:flex;align-items:center;justify-content:center;z-index:5}
.hero-nav-btn.prev{left:14px}.hero-nav-btn.next{right:14px}
.hero-dots{position:absolute;bottom:24px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5}
.hero-dots button{width:9px;height:9px;border-radius:50%;border:none;background:rgba(255,255,255,.55)}
.hero-dots button.active{background:var(--accent);width:22px;border-radius:6px}
.scroll-explore{position:absolute;bottom:6px;left:0;right:0;text-align:center;color:#fff;font-size:.75rem;font-weight:600;letter-spacing:1px;z-index:5;cursor:pointer;background:none;border:none}
.scroll-explore .arrow{display:block;margin:6px auto 0;width:18px;height:18px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg);animation:bob 1.6s infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(45deg)}50%{transform:translateY(6px) rotate(45deg)}}

/* ============ PROGRAMMES ============ */
.prog-grid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.prog-card{padding:26px;text-align:left;position:relative}
.prog-card .ic{width:52px;height:52px;border-radius:12px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-dark);font-size:1.3rem;margin-bottom:14px}
.prog-card h3{font-size:1.1rem;margin-bottom:6px}
.prog-card p{font-size:.88rem}
.prog-card .go{margin-top:14px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-dark);font-weight:700;font-size:.85rem}
.prog-card:hover .go{gap:10px}

/* ============ DESK (Principal/Chairman) ============ */
.desk{display:grid;grid-template-columns:1fr;gap:28px;align-items:center}
@media(min-width:820px){.desk{grid-template-columns:230px 1fr}}
.desk-photo{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);aspect-ratio:1/1;object-fit:cover;width:100%}
.desk-name{font-size:1.2rem;margin-top:14px}
.desk-role{color:var(--accent-dark);font-weight:700;font-size:.85rem}

/* ============ ACTIVITY CARDS ============ */
.activity-card{padding:24px 20px;text-align:center}
.activity-card img{width:58px;height:58px;object-fit:contain;margin:0 auto 12px}
.activity-card h3{font-size:1rem}
.activity-card p{font-size:.83rem;margin-top:6px}

/* ============ NEWS ============ */
.news-featured{display:grid;grid-template-columns:1fr;gap:0;overflow:hidden}
@media(min-width:800px){.news-featured{grid-template-columns:1.1fr 1fr}}
.news-featured img{width:100%;height:100%;object-fit:cover;min-height:220px}
.news-featured .body{padding:28px}
.news-grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.news-card{overflow:hidden}
.news-card img{height:170px;width:100%;object-fit:cover}
.news-card .body{padding:18px}
.news-card h3{font-size:1rem;margin:8px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.tab-btn{padding:9px 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:.85rem}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ============ VIDEO / GALLERY ============ */
.video-grid,.gallery-grid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.video-card{overflow:hidden;cursor:pointer}
.video-thumb{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.video-thumb img{width:100%;height:100%;object-fit:cover;transition:.4s}
.video-card:hover .video-thumb img{transform:scale(1.08)}
.play-ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.play-ic span{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;color:var(--accent-dark);font-size:1.2rem}
.video-card .body{padding:14px}
.gallery-cover{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3;cursor:pointer}
.gallery-cover img{width:100%;height:100%;object-fit:cover;transition:.4s}
.gallery-cover:hover img{transform:scale(1.06)}
.gallery-cover .yr-label{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent);color:#fff}
.photo-grid{grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.photo-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.photo-grid{grid-template-columns:repeat(4,1fr)}}
.photo-item{aspect-ratio:1/1;border-radius:10px;overflow:hidden;cursor:pointer}
.photo-item img{width:100%;height:100%;object-fit:cover;transition:.4s}
.photo-item:hover img{transform:scale(1.08)}

/* ============ LIGHTBOX/MODAL ============ */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2000;display:none;align-items:center;justify-content:center;flex-direction:column}
.lightbox.open{display:flex}
.lightbox img{max-width:92vw;max-height:78vh;object-fit:contain;border-radius:8px}
.lightbox .lb-controls{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;pointer-events:none}
.lightbox .lb-controls button{pointer-events:auto}
.lb-btn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:1.3rem}
.lb-close{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:1.2rem}
.lb-count{color:#fff;margin-top:14px;font-size:.85rem}
.video-modal-frame{width:min(92vw,900px);aspect-ratio:16/9}
.video-modal-frame iframe{width:100%;height:100%;border:0;border-radius:8px}

.modal-overlay{position:fixed;inset:0;background:rgba(15,20,10,.55);z-index:1500;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:var(--radius);max-width:460px;width:100%;padding:26px;box-shadow:var(--shadow-lg)}
.modal-box h3{margin-bottom:10px}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}

.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;padding:0 16px}
.toast{background:#233016;color:#fff;padding:12px 20px;border-radius:10px;font-size:.88rem;box-shadow:var(--shadow-lg);animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ SEARCH ============ */
.search-panel{position:fixed;inset:0;background:#fff;z-index:1800;display:none;flex-direction:column;padding:20px}
.search-panel.open{display:flex}
.search-top{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;width:100%}
.search-input-wrap{flex:1;position:relative}
.search-input-wrap input{width:100%;padding:14px 18px;border-radius:12px;border:2px solid var(--line);font-size:1rem}
.search-input-wrap input:focus{border-color:var(--accent)}
.search-results{max-width:760px;margin:24px auto 0;width:100%;overflow-y:auto}
.result-item{display:block;padding:16px;border-bottom:1px solid var(--line)}
.result-item:hover{background:var(--bg-off)}
.result-item .cat{color:var(--accent-dark);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px}
.result-item h4{margin-top:4px;font-size:1rem}
.result-item p{font-size:.85rem;margin-top:4px}

/* ============ PAGE HEADER / BREADCRUMB ============ */
.page-hero{background:var(--bg-off);padding:44px 0 34px;border-bottom:1px solid var(--line)}
.breadcrumb{display:flex;gap:6px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-soft);margin-bottom:10px}
.breadcrumb a{color:var(--accent-dark);font-weight:600}
.page-hero h1{font-size:clamp(1.5rem,3vw,2.1rem)}
main{min-height:50vh}

/* Accordion */
.accordion-item{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.accordion-head{width:100%;text-align:left;padding:16px 18px;background:#fff;border:none;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.accordion-head:hover{background:var(--bg-off)}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.accordion-item.open .accordion-body{max-height:2000px}
.accordion-inner{padding:4px 18px 18px}
.subject-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.subject-tags span{background:var(--bg-off);border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-size:.85rem}
.subject-group h4{font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-dark);margin-top:14px;margin-bottom:4px}

table.acad{width:100%;border-collapse:collapse;font-size:.85rem}
table.acad th,table.acad td{border:1px solid var(--line);padding:8px 10px;text-align:left}
table.acad th{background:var(--bg-off)}
.table-scroll{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft)}
.grid-2{grid-template-columns:1fr}
@media(min-width:820px){.grid-2{grid-template-columns:1fr 1fr}}
.info-list li{padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.info-list li b{color:var(--ink)}

form .field{margin-bottom:16px}
form label{display:block;font-weight:600;font-size:.85rem;margin-bottom:6px}
form input,form select,form textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:.95rem}
form input:focus,form select:focus,form textarea:focus{border-color:var(--accent)}
.error-text{color:#c0392b;font-size:.78rem;margin-top:4px}
.helper-text{color:var(--ink-soft);font-size:.78rem;margin-top:4px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}

/* ============ FOOTER ============ */
footer.site-footer{background:#16210c;color:#dfe7d3;padding:56px 0 20px;margin-top:40px}
.footer-grid{display:grid;gap:34px;grid-template-columns:1fr}
@media(min-width:820px){.footer-grid{grid-template-columns:1.4fr 1fr 1fr 1fr}}
footer h4{color:#fff;font-size:.95rem;margin-bottom:14px}
footer a{color:#c4d1b3;font-size:.86rem;line-height:2.2;display:block}
footer a:hover{color:var(--accent)}
.foot-social{display:flex;gap:10px;margin-top:14px}
.foot-social a{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.foot-bottom{border-top:1px solid rgba(255,255,255,.12);margin-top:36px;padding-top:20px;font-size:.78rem;color:#a9b79a;text-align:center}

/* ============ ADMIN ============ */
.admin-login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-off);padding:20px}
.admin-login-card{background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);padding:34px 26px;width:100%;max-width:380px;text-align:center}
.admin-login-card img{width:56px;margin:0 auto 12px}
.pw-wrap{position:relative}
.pw-wrap button{position:absolute;right:10px;top:9px;background:none;border:none;font-size:.78rem;font-weight:700;color:var(--accent-dark)}
.admin-shell{min-height:100vh;background:var(--bg-off);padding-bottom:70px}
.admin-header{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:80}
.admin-header img{width:36px}
.admin-header .t{font-weight:700;font-size:.9rem}
.admin-header .t small{display:block;font-weight:500;color:var(--ink-soft);font-size:.72rem}
.admin-body{max-width:920px;margin:0 auto;padding:18px}
.admin-card-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.admin-tile{padding:18px;text-align:left}
.admin-tile .n{font-size:1.5rem;font-weight:800;color:var(--accent-dark)}
.admin-tile .l{font-size:.82rem;color:var(--ink-soft);margin-top:2px}
.record-card{padding:16px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.record-card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.record-card .title{font-weight:700}
.record-card .meta{font-size:.78rem;color:var(--ink-soft)}
.status-pill{font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:999px}
.status-pill.pub{background:var(--accent-light);color:var(--accent-dark)}
.status-pill.draft{background:#f1e6cf;color:#8a6d1f}
.status-pill.feat{background:#e6f0ff;color:#2255aa}
.record-actions{display:flex;gap:8px;flex-wrap:wrap}
.record-actions button{flex:1;min-width:80px;padding:9px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:.8rem}
.record-actions button.danger{color:#c0392b;border-color:#f2c9c2}
.sticky-save{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) 14px;display:flex;gap:10px;margin-top:20px}
.sticky-save .btn{flex:1;justify-content:center}
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back-row button{background:none;border:none;font-weight:700;color:var(--accent-dark);display:flex;align-items:center;gap:4px}
.img-preview{margin-top:10px;border-radius:10px;overflow:hidden;border:1px solid var(--line);max-height:180px}
.img-preview img{width:100%;height:180px;object-fit:cover}
.admin-searchbar{margin-bottom:16px}
.admin-menu{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:22px}
.admin-menu a{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;font-weight:700;font-size:.85rem}
.admin-menu a:hover{border-color:var(--accent);color:var(--accent-dark)}
.dev-note{background:#fff7e6;border:1px solid #f0d99a;padding:10px 14px;border-radius:10px;font-size:.78rem;color:#7a5c00;margin-bottom:16px}
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<!-- ============ HEADER ============ -->
<header class="site-header">
  <div class="header-inner">
    <a href="#/home" class="brand" aria-label="Ajara Mahavidyalaya Home">
      <img src="https://cdn.shopify.com/s/files/1/1012/1602/6995/files/IMG-3641.png?v=1789199821" alt="Ajara Mahavidyalaya logo">
      <span class="brand-text">
        <span class="name">Ajara Mahavidyalaya, Ajara</span>
        <span class="sub">Accredited at B by NAAC</span>

}

function fmtDate(d){
  if(!d) return "";
  var dt = new Date(d+"T00:00:00");
  if(isNaN(dt)) return d;
  var months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  return dt.getDate()+" "+months[dt.getMonth()]+" "+dt.getFullYear();
}

   ============================================================ */
var observer;
function initReveal(){
  var els = document.querySelectorAll(".reveal:not(.in)");
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ els.forEach(function(e){e.classList.add("in");}); return; }
  if(observer) observer.disconnect();
  observer = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); observer.unobserve(e.target); } });
  }, {threshold:.12});
  els.forEach(function(e){ observer.observe(e); });
}

function initHeroSlider(){
  var slides = document.querySelectorAll("#heroSection .hero-slide");
  var dots = document.querySelectorAll("#heroSection .hero-dots button");
  if(!slides.length) return;
  var i=0, timer;
  function show(n){
    slides[i].classList.remove("active"); dots[i].classList.remove("active");
    i=(n+slides.length)%slides.length;
    slides[i].classList.add("active"); dots[i].classList.add("active");
  }
  function next(){ show(i+1); }
  function restart(){ clearInterval(timer); timer=setInterval(next,5000); }
  restart();
  document.getElementById("heroNext").onclick=function(){ next(); restart(); };
  document.getElementById("heroPrev").onclick=function(){ show(i-1); restart(); };
  dots.forEach(function(d){ d.onclick=function(){ show(parseInt(d.dataset.i,10)); restart(); }; });
  document.getElementById("heroSection").addEventListener("mouseenter", function(){ clearInterval(timer); });
  document.getElementById("heroSection").addEventListener("mouseleave", restart);
  document.getElementById("scrollExploreBtn").onclick = function(){
    var next = document.getElementById("heroSection").nextElementSibling;
    if(next) next.scrollIntoView({behavior:(matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth')});
  };
  // touch swipe
  var startX=null;
  var hero=document.getElementById("heroSection");
  hero.addEventListener("touchstart", function(e){ startX=e.touches[0].clientX; });
  hero.addEventListener("touchend", function(e){
    if(startX===null) return;
    var dx = e.changedTouches[0].clientX - startX;
    if(dx>40){ show(i-1); restart(); } else if(dx<-40){ next(); restart(); }
    startX=null;
  });
}

function renderProgrammeRoute(parts, main){
  if(!parts[1]){
    return renderHome === main ? null : (function(){
      var icons={science:"Sc",commerce:"Co",arts:"Ar",bca:"BCA",mcom:"MC",ma:"MA"};
      var cards = Object.keys(PROGRAMMES).map(function(k){
        return '<a href="#/programme/'+k+'" class="card prog-card reveal"><span class="ic">'+icons[k]+'</span><h3>'+PROGRAMMES[k].title+'</h3><span class="go">Explore Programme &rarr;</span></a>';
      }).join("");
      main.innerHTML = pageHero("Programme",[{label:"Home",href:"#/home"},{label:"Programme"}])+
       '<section class="section container"><div class="grid prog-grid">'+cards+'</div></section>';
    })();
  }
  var key = parts[1];
  var p = PROGRAMMES[key];
  if(!p){ render404(main); return; }
  var body = "";
  if(p.parts){
    body = p.parts.map(function(part, i){
      var inner="";
      if(part.compulsory) inner += '<div class="subject-group"><h4>Compulsory Subjects</h4><div class="subject-tags">'+part.compulsory.map(function(s){return '<span>'+esc(s)+'</span>';}).join("")+'</div></div>';
      if(part.optional) inner += '<div class="subject-group"><h4>Optional Subjects</h4><div class="subject-tags">'+part.optional.map(function(s){return '<span>'+esc(s)+'</span>';}).join("")+'</div></div>';
      if(part.major) inner += '<div class="subject-group"><h4>Major Subject</h4><div class="subject-tags">'+part.major.map(function(s){return '<span>'+esc(s)+'</span>';}).join("")+'</div></div>';
      if(part.minor) inner += '<div class="subject-group"><h4>Minor Subject</h4><div class="subject-tags">'+part.minor.map(function(s){return '<span>'+esc(s)+'</span>';}).join("")+'</div></div>';
      if(part.other) inner += '<div class="subject-group"><h4>Also</h4><div class="subject-tags">'+part.other.map(function(s){return '<span>'+esc(s)+'</span>';}).join("")+'</div></div>';
      return accordionItem(part.label, inner, i===0);
    }).join("");
  } else if(p.semesters){
    body = p.semesters.map(function(s,i){
      var inner = s.comingSoon ? '<p><b>Coming Soon &rarr;</b></p>' : '<div class="subject-tags">'+s.items.map(function(x){return '<span>'+esc(x)+'</span>';}).join("")+'</div>';
      return accordionItem(s.label, inner, i===0);
    }).join("");
  } else if(p.tables){
    body = p.tables.map(function(t,i){
      var rows = t.rows.map(function(r){ return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join("")+'</tr>'; }).join("");
      var inner = '<div class="table-scroll"><table class="acad"><thead><tr><th>Sr.</th><th>Type</th><th>Course Name</th><th>Code</th><th>Credits</th><th>Lectures</th><th>Hours</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
        '<p class="helper-text" style="margin-top:8px"><b>Total:</b> '+esc(t.total)+'</p>';
      return accordionItem(t.label, inner, i===0);
    }).join("") + (p.notes ? '<div style="margin-top:20px"><h4 style="font-size:.9rem;color:var(--accent-dark)">Notes</h4><ul class="info-list">'+p.notes.map(function(n){return '<li>'+esc(n)+'</li>';}).join("")+'</ul></div>' : "");
  }
  main.innerHTML = pageHero(p.title,[{label:"Home",href:"#/home"},{label:"Programme",href:"#/programme"},{label:p.title}])+
   '<section class="section container reveal in">'+
   (p.subtitle?('<p class="eyebrow">'+esc(p.subtitle)+'</p>'):"")+
   '<p style="max-width:760px">'+esc(p.intro||"")+'</p>'+
   '<div style="margin-top:24px">'+body+'</div>'+
   '<a href="#/programme" class="btn outline sm" style="margin-top:24px">&larr; Back to Programmes</a>'+
   '</section>';
  initAccordions();
}
function accordionItem(title, inner, open){
  return '<div class="accordion-item'+(open?' open':'')+'"><button class="accordion-head">'+esc(title)+'<span>'+(open?'&#8722;':'&#43;')+'</span></button><div class="accordion-body"><div class="accordion-inner">'+inner+'</div></div></div>';
}
function initAccordions(){
  document.querySelectorAll(".accordion-head").forEach(function(btn){
    btn.onclick = function(){
      var item = btn.parentElement;
      item.classList.toggle("open");
      btn.querySelector("span").innerHTML = item.classList.contains("open") ? "&#8722;" : "&#43;";
    };
  });
}

function renderFacultyRoute(parts, main){
  if(parts[1]) return renderFacultyDetail(parts[1], main);

  var depts = ["All"].concat(Array.from(new Set(pub.map(function(f){return f.department;}).filter(Boolean))));

   '<div class="grid" id="facultyGrid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))"></div>'+

  function draw(dept){

    var grid = document.getElementById("facultyGrid");
    if(!list.length){ grid.innerHTML = '<div class="empty-state">Faculty information will be updated soon.</div>'; return; }

      return '<a href="#/faculty/'+f.id+'" class="card reveal in" style="padding:18px;text-align:center">'+

        '<div style="margin-top:10px"><span class="go">View Profile &rarr;</span></div></a>';
    }).join("");
  }
  draw("All");
  if(document.getElementById("facTabs")){
    document.getElementById("facTabs").addEventListener("click", function(e){
      if(e.target.tagName!=="BUTTON") return;
      document.querySelectorAll("#facTabs .tab-btn").forEach(function(b){b.classList.remove("active");});
      e.target.classList.add("active"); draw(e.target.dataset.d);
    });
  }

var lbState={list:[],i:0};
function openLightbox(list,i){
  lbState={list:list,i:i};
  document.getElementById("lightbox").classList.add("open");
  updateLightbox();
}
function updateLightbox(){
  var p = lbState.list[lbState.i];
  document.getElementById("lbImg").src = p.imageUrl;
  document.getElementById("lbImg").alt = p.alt||"";
  document.getElementById("lbCount").textContent = (lbState.i+1)+" / "+lbState.list.length;
}
document.getElementById("lbClose").onclick=function(){ document.getElementById("lightbox").classList.remove("open"); };
document.getElementById("lbPrev").onclick=function(){ lbState.i=(lbState.i-1+lbState.list.length)%lbState.list.length; updateLightbox(); };
document.getElementById("lbNext").onclick=function(){ lbState.i=(lbState.i+1)%lbState.list.length; updateLightbox(); };
document.addEventListener("keydown", function(e){
  if(document.getElementById("lightbox").classList.contains("open")){
    if(e.key==="Escape") document.getElementById("lightbox").classList.remove("open");
    if(e.key==="ArrowLeft") document.getElementById("lbPrev").click();
    if(e.key==="ArrowRight") document.getElementById("lbNext").click();
  }
  if(e.key==="Escape") document.getElementById("videoModal").classList.remove("open");
});

function isAdmin(){ return sessionStorage.getItem(SESSION_KEY)==="1"; }
function renderAdminRoute(parts, main){
  if(!isAdmin()){ renderAdminLogin(main); return; }
  var sub = parts[1] || "dashboard";
  renderAdminShell(sub, parts, main);
}
function renderAdminLogin(main){
  main.innerHTML = '<div class="admin-login-wrap"><div class="admin-login-card">'+
   '<img src="https://cdn.shopify.com/s/files/1/1012/1602/6995/files/IMG-3641.png?v=1789199821" alt="Logo">'+
   '<h2>Admin Login</h2>'+
   '<form id="adminLoginForm" style="text-align:left;margin-top:16px">'+
   field("Email","aEmail","email",true)+
   '<div class="field"><label for="aPass">Password</label><div class="pw-wrap"><input type="password" id="aPass" required><button type="button" id="togglePw">SHOW</button></div></div>'+
   '<div class="toggle-row"><label style="font-weight:500;display:flex;align-items:center;gap:8px"><input type="checkbox" id="rememberDevice" style="width:auto"> Remember this device</label></div>'+
   '<div id="loginErr"></div>'+
   '<button type="submit" class="btn" style="width:100%;justify-content:center;margin-top:6px">Login</button>'+
   '</form></div></div>';
  document.getElementById("togglePw").onclick=function(){
    var i=document.getElementById("aPass"); i.type = i.type==="password"?"text":"password";
    this.textContent = i.type==="password"?"SHOW":"HIDE";
  };
  document.getElementById("adminLoginForm").addEventListener("submit", function(e){
    e.preventDefault();
    var email=document.getElementById("aEmail").value.trim();
    var pass=document.getElementById("aPass").value;
    var err=document.getElementById("loginErr");
    if(email===ADMIN_EMAIL && pass===ADMIN_PASSWORD){
      sessionStorage.setItem(SESSION_KEY,"1");
      if(document.getElementById("rememberDevice").checked) localStorage.setItem(SESSION_KEY,"1");
      logActivity("LOGIN","Admin");
      navigate("#/admin/dashboard"); renderRoute();
    } else {
      err.innerHTML='<p class="error-text">Invalid email or password.</p>';
    }
  });
}
if(localStorage.getItem(SESSION_KEY)==="1"){ sessionStorage.setItem(SESSION_KEY,"1"); }

function adminLogout(){
  sessionStorage.removeItem(SESSION_KEY); localStorage.removeItem(SESSION_KEY);
  logActivity("LOGOUT","Admin");
  navigate("#/home"); renderRoute();
}

function renderAdminShell(sub, parts, main){
  var content = document.createElement("div");
  content.className="admin-shell";
  var header = '<div class="admin-header">'+
    '<img src="https://cdn.shopify.com/s/files/1/1012/1602/6995/files/IMG-3641.png?v=1789199821" alt="Logo">'+
    '<div class="t">Ajara Mahavidyalaya<small>Admin Dashboard</small></div>'+
    '<button class="btn sm outline" style="margin-left:auto" id="adminLogoutBtn">Logout</button></div>';
  var body = '<div class="admin-body" id="adminBody"></div>';
  content.innerHTML = header + body;
  main.appendChild(content);
  document.getElementById("adminLogoutBtn").onclick = adminLogout;

  var body_el = document.getElementById("adminBody");
  body_el.innerHTML = '<div class="dev-note">Client-side authentication in a single HTML file is not suitable for production-grade security. Replace with a server-side authentication system before public deployment.</div>' +
    (sub==="dashboard" ? adminDashboardHtml() : "");
  if(sub==="dashboard"){ wireDashboard(); return; }
  renderAdminSection(sub, parts, body_el);
}

function renderAdminSection(sub, parts, container){
  if(sub==="gallery") return renderAdminGallery(parts, container);
  if(sub==="contact") return renderAdminContact(container);
  var cfg = ENTITY_CONFIGS[sub];
  if(!cfg){ container.innerHTML += '<div class="empty-state">Unknown admin section.</div>'; return; }
  var id = parts[2];
  if(id) return renderAdminForm(cfg, id, container);
  renderAdminList(cfg, container);
}

function renderAdminList(cfg, container){
  var list = DB[cfg.key].slice().sort(function(a,b){return (a.order||0)-(b.order||0);});
  container.innerHTML += '<div class="back-row"><button onclick="AjaraApp.navigate(\'#/admin/dashboard\')">&larr; Back</button></div>'+
    '<h2>'+cfg.label+'</h2>'+
    '<div class="admin-searchbar"><input type="text" id="adminSearchBox" placeholder="Search '+cfg.label+'..."></div>'+
    '<a href="#/admin/'+Object.keys(ENTITY_CONFIGS).filter(function(k){return ENTITY_CONFIGS[k]===cfg;})[0]+'/new" class="btn sm" style="margin-bottom:16px">+ Add New</a>'+
    '<div id="adminRecordList"></div>';
  function titleOf(item){ return item.title || item.name || "Untitled"; }
  function draw(q){
    q=(q||"").toLowerCase();
    var filtered = q ? list.filter(function(i){return titleOf(i).toLowerCase().indexOf(q)>-1;}) : list;
    var box = document.getElementById("adminRecordList");
    if(!filtered.length){ box.innerHTML='<div class="empty-state">No records yet.</div>'; return; }
    var entityKey = Object.keys(ENTITY_CONFIGS).filter(function(k){return ENTITY_CONFIGS[k]===cfg;})[0];
    box.innerHTML = filtered.map(function(item){
      return '<div class="card record-card"><div class="top"><div><div class="title">'+esc(titleOf(item))+'</div><div class="meta">'+esc(item.category||item.department||item.date||"")+'</div></div>'+
        '<span class="status-pill '+(item.published?'pub':'draft')+'">'+(item.published?'PUBLISHED':'DRAFT')+'</span></div>'+
        (item.featured?'<span class="status-pill feat">FEATURED</span>':'')+
        '<div class="record-actions">'+
        '<button onclick="AjaraApp.navigate(\'#/admin/'+entityKey+'/'+item.id+'\')">Edit</button>'+
        '<button onclick="AjaraApp.togglePublish(\''+entityKey+'\',\''+item.id+'\')">'+(item.published?'Unpublish':'Publish')+'</button>'+
        '<button class="danger" onclick="AjaraApp.deleteRecord(\''+entityKey+'\',\''+item.id+'\')">Delete</button>'+
        '</div></div>';
    }).join("");
  }
  draw("");
  document.getElementById("adminSearchBox").addEventListener("input", function(e){ draw(e.target.value); });
}

function renderAdminForm(cfg, id, container){
  var isNew = id==="new";
  var item = isNew ? {} : DB[cfg.key].filter(function(x){return x.id===id;})[0];
  if(!item){ container.innerHTML += '<div class="empty-state">Record not found.</div>'; return; }
  var entityKey = Object.keys(ENTITY_CONFIGS).filter(function(k){return ENTITY_CONFIGS[k]===cfg;})[0];
  var formHtml = cfg.fields.map(function(f){
    var val = item[f.k]!==undefined ? item[f.k] : "";
    if(f.type==="toggle"){
      return '<div class="toggle-row"><label style="font-weight:600">'+f.label+'</label><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="f_'+f.k+'" '+(val?'checked':'')+' style="width:auto;transform:scale(1.3)"></label></div>';
    }
    if(f.type==="select"){
      return '<div class="field"><label>'+f.label+'</label><select id="f_'+f.k+'">'+f.options.map(function(o){return '<option '+(val===o?'selected':'')+'>'+o+'</option>';}).join("")+'</select></div>';
    }
    if(f.type==="textarea"){
      return '<div class="field"><label>'+f.label+(f.required?' *':'')+'</label><textarea id="f_'+f.k+'" rows="5">'+esc(val)+'</textarea></div>';
    }
    if(f.type==="image"){
      return '<div class="field"><label>'+f.label+'</label><input type="text" id="f_'+f.k+'" value="'+esc(val)+'" placeholder="https://..."><div class="img-preview" id="prev_'+f.k+'">'+(val?('<img src="'+val+'" '+imgFallbackAttr()+'>'):'')+'</div></div>';
    }
    if(f.type==="youtube"){
      var vid = extractYouTubeId(val);
      return '<div class="field"><label>'+f.label+(f.required?' *':'')+'</label><input type="text" id="f_'+f.k+'" value="'+esc(val)+'" placeholder="https://youtube.com/watch?v=..."><div class="helper-text" id="ytHelper">'+(vid?('Video ID: '+vid):'')+'</div><div class="img-preview" id="ytPreview">'+(vid?('<img src="'+ytThumb(vid)+'" '+imgFallbackAttr()+'>'):'')+'</div></div>';
    }
    if(f.type==="date"){
      return '<div class="field"><label>'+f.label+(f.required?' *':'')+'</label><input type="date" id="f_'+f.k+'" value="'+esc(val)+'"></div>';
    }
    if(f.type==="number"){
      return '<div class="field"><label>'+f.label+'</label><input type="number" id="f_'+f.k+'" value="'+esc(val||1)+'"></div>';
    }
    if(f.type==="url"){
      return '<div class="field"><label>'+f.label+'</label><input type="text" id="f_'+f.k+'" value="'+esc(val)+'" placeholder="https://..."></div>';
    }
    return '<div class="field"><label>'+f.label+(f.required?' *':'')+'</label><input type="text" id="f_'+f.k+'" value="'+esc(val)+'"></div>';
  }).join("");

  container.innerHTML += '<div class="back-row"><button onclick="AjaraApp.navigate(\'#/admin/'+entityKey+'\')">&larr; Back</button></div>'+
    '<h2>'+(isNew?'Add':'Edit')+' '+cfg.label.replace(/s$/,'')+'</h2>'+
    '<form id="adminEntityForm">'+formHtml+'<div id="formErr"></div></form>'+
    '<div class="sticky-save"><button class="btn outline" onclick="AjaraApp.navigate(\'#/admin/'+entityKey+'\')" type="button">Cancel</button><button class="btn" id="saveEntityBtn">Save</button></div>';

  cfg.fields.forEach(function(f){
    if(f.type==="image"){
      var inp=document.getElementById("f_"+f.k);
      inp.addEventListener("input", function(){
        var prev=document.getElementById("prev_"+f.k);
        prev.innerHTML = isValidUrl(inp.value) ? ('<img src="'+esc(inp.value)+'" onerror="this.parentElement.innerHTML=\'<p class=&quot;error-text&quot;>Unable to load this image.</p>\'">') : '';
      });
    }
    if(f.type==="youtube"){
      var yinp=document.getElementById("f_"+f.k);
      yinp.addEventListener("input", function(){
        var vid=extractYouTubeId(yinp.value);
        document.getElementById("ytHelper").textContent = vid?("Video ID: "+vid):"Enter a valid YouTube URL.";
        document.getElementById("ytPreview").innerHTML = vid ? ('<img src="'+ytThumb(vid)+'" onerror="this.src=\''+ytThumbFallback(vid)+'\'">') : '';
      });
    }
  });

  document.getElementById("saveEntityBtn").onclick = function(){
    var data = {};
    var errs=[];
    cfg.fields.forEach(function(f){
      var el = document.getElementById("f_"+f.k);
      var v;
      if(f.type==="toggle") v = el.checked;
      else v = el.value;
      if(f.required && !v){ errs.push(f.label+" is required."); }
      if(f.type==="url" && v && !isValidUrl(v)){ errs.push(f.label+" must be a valid http(s) URL."); }
      if(f.type==="youtube" && v){
        var vid = extractYouTubeId(v);
        if(!vid){ errs.push("Please enter a valid YouTube URL."); }
        else { item.videoId = vid; item.thumbnail = ytThumb(vid); }
      }
      data[f.k]=v;
    });
    if(errs.length){ document.getElementById("formErr").innerHTML = errs.map(function(e){return '<p class="error-text">'+esc(e)+'</p>';}).join(""); return; }
    Object.assign(item, data);
    item.updatedAt = nowIso();
    if(isNew){ item.id = uid(entityKey); item.createdAt = nowIso(); if(item.published===undefined) item.published=true; DB[cfg.key].push(item); logActivity("ADD", data.title||data.name); }
    else { logActivity("EDIT", data.title||data.name); }
    saveStore(cfg.store, DB[cfg.key]);
    toast("Saved successfully.");
    navigate("#/admin/"+entityKey);
    renderRoute();
  };
}
  function togglePublish(entityKey, id){
  var cfg = ENTITY_CONFIGS[entityKey];
  var item = DB[cfg.key].filter(function(x){return x.id===id;})[0];
  if(!item) return;
  item.published = !item.published;
  saveStore(cfg.store, DB[cfg.key]);
  logActivity(item.published?"PUBLISH":"UNPUBLISH", item.title||item.name);
  toast(item.published?"Published successfully.":"Saved successfully.");
  renderRoute();
}
function deleteRecord(entityKey, id){
  confirmModal("Are you sure you want to delete this item?", function(){
    var cfg = ENTITY_CONFIGS[entityKey];
    DB[cfg.key] = DB[cfg.key].filter(function(x){return x.id!==id;});
    saveStore(cfg.store, DB[cfg.key]);
    logActivity("DELETE", id);
    toast("Deleted successfully.");
    renderRoute();
  });
}

function renderAdminGallery(parts, container){

    '<h2>Photo Gallery Management</h2>'+
    '<div id="galleryAdminBody"></div>';
  var body = document.getElementById("galleryAdminBody");
  function draw(){
    var cols = DB.gallery.collections.slice().sort(function(a,b){return (a.order||0)-(b.order||0);});
    body.innerHTML = '<div class="field"><label>Create New Academic Year (e.g. 2027-2028)</label><div style="display:flex;gap:8px"><input type="text" id="newYearId" placeholder="2027-2028" style="flex:1"><button class="btn sm" id="addYearBtn">Add</button></div></div>'+
      cols.map(function(c){
        var photos = DB.gallery.photos.filter(function(p){return p.year===c.id;}).sort(function(a,b){return (a.order||0)-(b.order||0);});
        return '<div class="card" style="padding:16px;margin-top:16px"><div class="top" style="display:flex;justify-content:space-between"><h3>'+esc(c.title)+'</h3><button class="record-actions" style="border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:#c0392b" onclick="AjaraApp.deleteYear(\''+c.id+'\')">Delete Year</button></div>'+
          '<div id="photosOf_'+c.id+'">'+(photos.length? photos.map(function(p){
            return '<div class="record-card" style="flex-direction:row;align-items:center"><img src="'+p.imageUrl+'" style="width:60px;height:60px;object-fit:cover;border-radius:8px" '+imgFallbackAttr()+'>'+
              '<div style="flex:1;margin-left:10px"><span class="status-pill '+(p.published?'pub':'draft')+'">'+(p.published?'PUBLISHED':'DRAFT')+'</span></div>'+
              '<button onclick="AjaraApp.togglePhoto(\''+p.id+'\')" style="margin-right:6px">'+(p.published?'Unpublish':'Publish')+'</button>'+
              '<button class="danger" onclick="AjaraApp.deletePhoto(\''+p.id+'\')" style="color:#c0392b">Delete</button></div>';
          }).join("") : '<div class="empty-state">Photos for this academic year will be added soon.</div>')+'</div>'+
          '<div class="field" style="margin-top:12px"><label>Add Photo — Image URL</label><input type="text" id="newPhoto_'+c.id+'" placeholder="https://..."><div class="img-preview" id="newPhotoPrev_'+c.id+'"></div><button class="btn sm" style="margin-top:8px" onclick="AjaraApp.addPhoto(\''+c.id+'\')">Add Photo</button></div>'+
          '</div>';
      }).join("");
    document.getElementById("addYearBtn").onclick = function(){
      var v = document.getElementById("newYearId").value.trim();
      if(!v){ toast("Please enter an academic year."); return; }
      var idv = v.replace(/\s/g,"");
      if(DB.gallery.collections.some(function(c){return c.id===idv;})){ toast("This academic year already exists."); return; }
      DB.gallery.collections.push({id:idv, title:v.replace("-","–"), order:DB.gallery.collections.length+1});
      saveStore("ajaramahavidyalaya_gallery", DB.gallery);
      logActivity("ADD","Gallery year "+v);
      toast("Saved successfully."); draw();
    };
    cols.forEach(function(c){
      var inp = document.getElementById("newPhoto_"+c.id);
      if(inp) inp.addEventListener("input", function(){
        var prev = document.getElementById("newPhotoPrev_"+c.id);
        prev.innerHTML = isValidUrl(inp.value) ? ('<img src="'+esc(inp.value)+'" onerror="this.parentElement.innerHTML=\'<p class=&quot;error-text&quot;>Unable to load this image.</p>\'">') : '';
      });
    });
  }
  draw();
  window.AjaraApp.__galleryDraw = draw;
}
function addPhoto(yearId){
  var inp = document.getElementById("newPhoto_"+yearId);
  var url = inp.value.trim();
  if(!isValidUrl(url)){ toast("Please enter a valid image URL."); return; }
  DB.gallery.photos.push({id:uid("p"), year:yearId, imageUrl:url, caption:"", alt:"Ajara Mahavidyalaya photo — "+yearId, published:true, order:DB.gallery.photos.filter(function(p){return p.year===yearId;}).length+1});
  saveStore("ajaramahavidyalaya_gallery", DB.gallery);
  logActivity("ADD","Photo in "+yearId);
  toast("Saved successfully.");
  window.AjaraApp.__galleryDraw();
}
function togglePhoto(id){
  var p = DB.gallery.photos.filter(function(x){return x.id===id;})[0]; if(!p) return;
  p.published=!p.published; saveStore("ajaramahavidyalaya_gallery", DB.gallery);
  toast("Saved successfully."); window.AjaraApp.__galleryDraw();
}
function deletePhoto(id){
  confirmModal("Are you sure you want to delete this photo?", function(){
    DB.gallery.photos = DB.gallery.photos.filter(function(x){return x.id!==id;});
    saveStore("ajaramahavidyalaya_gallery", DB.gallery);
    logActivity("DELETE","Photo"); toast("Deleted successfully."); window.AjaraApp.__galleryDraw();
  });
}
function deleteYear(id){
  confirmModal("Deleting will remove this academic year and its photos. Continue?", function(){
    DB.gallery.collections = DB.gallery.collections.filter(function(c){return c.id!==id;});
    DB.gallery.photos = DB.gallery.photos.filter(function(p){return p.year!==id;});
    saveStore("ajaramahavidyalaya_gallery", DB.gallery);
    logActivity("DELETE","Gallery year "+id); toast("Deleted successfully."); window.AjaraApp.__galleryDraw();
  });
}

/* ---- Contact settings admin ---- */
function renderAdminContact(container){
  var c = DB.contact;
  container.innerHTML += '<div class="back-row"><button onclick="AjaraApp.navigate(\'#/admin/dashboard\')">&larr; Back</button></div>'+
    '<h2>Contact Settings</h2><form id="contactSettingsForm">'+
    field("College Name","csName","text",true)+field("Address","csAddress","textarea",true)+
    field("Phone","csPhone","text",true)+field("Email","csEmail","text",false)+
    field("Map URL","csMap","text",false)+field("Facebook URL","csFb","text",false)+
    field("Twitter URL","csTw","text",false)+field("LinkedIn URL","csLi","text",false)+field("YouTube URL","csYt","text",false)+
    '</form><div class="sticky-save"><button class="btn" id="saveContactBtn">Save</button></div>';
  document.getElementById("csName").value=c.name; document.getElementById("csAddress").value=c.address;
  document.getElementById("csPhone").value=c.phone; document.getElementById("csEmail").value=c.email||"";
  document.getElementById("csMap").value=c.mapUrl; document.getElementById("csFb").value=c.facebook;
  document.getElementById("csTw").value=c.twitter; document.getElementById("csLi").value=c.linkedin; document.getElementById("csYt").value=c.youtube;
  document.getElementById("saveContactBtn").onclick = function(){
    DB.contact = {name:document.getElementById("csName").value,address:document.getElementById("csAddress").value,phone:document.getElementById("csPhone").value,email:document.getElementById("csEmail").value,mapUrl:document.getElementById("csMap").value,facebook:document.getElementById("csFb").value,twitter:document.getElementById("csTw").value,linkedin:document.getElementById("csLi").value,youtube:document.getElementById("csYt").value};
    saveStore("ajaramahavidyalaya_contact", DB.contact);
    logActivity("EDIT","Contact Settings");
    toast("Saved successfully.");
    renderFooter();
  };
}
